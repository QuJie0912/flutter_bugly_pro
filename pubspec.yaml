name: flutter_bugly_pro
description: "基于腾讯 Bugly SDK 封装的 Flutter 插件，解决官方SDK缺少arm64模拟器架构切片引发的编译失败问题"
version: 1.0.2
homepage: https://github.com/QuJie0912/flutter_bugly_pro

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.qq.bugly.flutter_bugly_pro
        pluginClass: FlutterBuglyProPlugin
      ios:
        pluginClass: FlutterBuglyProPlugin
